name: Parallax
options:
  bundleIdPrefix: io.parallax
  deploymentTarget: { iOS: "17.4" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Parallax:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes: ["**/.DS_Store"]
    dependencies:
      - framework: ParallaxFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.parallax.app
        SWIFT_OBJC_BRIDGING_HEADER: ios-app/Bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-ObjC]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: ios-app/Info.plist
      properties:
        CFBundleDisplayName: Parallax
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Audio : maintient l'app vivante pendant que l'utilisateur est dans
        # Réglages pour valider le jumelage. Sans lui, l'app est suspendue,
        # la diffusion Bonjour s'arrête et rien n'apparaît sous « Jumeler avec ».
        UIBackgroundModes: [audio]
        # Ces deux clés conditionnent la découverte par Réglages.
        NSLocalNetworkUsageDescription:
          Parallax annonce un service de jumelage que ton iPhone doit trouver sur le réseau local.
        NSBonjourServices: ["_remotepairing._tcp", "_parallax._tcp"]
        NSLocationWhenInUseUsageDescription:
          Affiche ta position réelle sur la carte comme point de départ.
        ITSAppUsesNonExemptEncryption: false
