name: PrismTarget
options:
  bundleIdPrefix: io.prism
  deploymentTarget: { iOS: "17.4" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PrismTarget:
    type: application
    platform: iOS
    sources:
      - path: sandbox
        excludes: ["**/.DS_Store"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.prism.target
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: sandbox/Info.plist
      properties:
        CFBundleDisplayName: Cible Prism
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
