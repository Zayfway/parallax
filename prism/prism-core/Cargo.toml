[package]
name    = "prism-core"
version = "0.1.0"
edition = "2021"

[lib]
name       = "prism_core"
# staticlib (lié dans le xcframework, embed:false) + rlib. La cdylib échoue au
# link sur cible device — l'hôte est lié statiquement, exactement comme Parallax.
crate-type = ["staticlib", "rlib"]

# ═══════════════════════════════════════════════════════════════════════════
# LE FLAG QUI COMPTE — même patron que Parallax.
#
# Hors feature, le crate compile seul, sans réseau, en quelques secondes, et
# expose la même surface C. Les fonctions rendent PR_ERR_NOT_BUILT (retours
# c_int) ou NULL + set_last_error (retours pointeur). L'app se lance, l'UI est
# navigable, la CI est verte.
#
# `agent-link` branche le vrai client loopback (régions / scan / affinage /
# lecture / écriture). `static-macho` est RÉSERVÉ au jalon 2 (analyseur Mach-O
# local + patch). `build_profile()` doit reconnaître CHAQUE combinaison, sinon
# les Réglages affichent « stub » alors que le natif est là.
# ═══════════════════════════════════════════════════════════════════════════
[features]
default      = []
agent-link   = []
static-macho = []
full         = ["agent-link", "static-macho"]

[dependencies]
prism-proto = { path = "../prism-proto" }
serde_json  = "1"
tracing     = "0.1"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = "z"
lto       = true
