name: Prism
options:
  bundleIdPrefix: io.prism
  deploymentTarget: { iOS: "17.4" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"      # source du tag prism-v0.1.0 (grep sur CE fichier)
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal   # runtime trappe → callbacks FFI en portée fichier

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: prism-ios
        excludes: ["**/.DS_Store"]
    dependencies:
      - framework: PrismFFI.xcframework
        embed: false                    # statique — lié, pas copié
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.prism.app
        SWIFT_OBJC_BRIDGING_HEADER: prism-ios/Bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-ObjC]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: prism-ios/Info.plist
      properties:
        CFBundleDisplayName: Prism
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Canal loopback vers l'agent injecté (127.0.0.1). Pas de type Bonjour
        # au jalon 1 — port fixe. Jamais le schéme `parallax` (collision device).
        NSLocalNetworkUsageDescription:
          Prism dialogue avec l'agent injecté dans l'app cible par une connexion locale en boucle (127.0.0.1).
        CFBundleURLTypes:
          - CFBundleURLName: io.prism.app
            CFBundleURLSchemes: [prism]
