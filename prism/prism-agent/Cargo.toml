[package]
name    = "prism-agent"
version = "0.1.0"
edition = "2021"
build   = "build.rs"

[lib]
name       = "prism_agent"
# cdylib injecté. Contient le moteur mémoire (Rust) ET l'overlay UIKit
# (Objective-C compilé par build.rs/cc dans le même artefact).
crate-type = ["cdylib"]

[dependencies]
prism-proto = { path = "../prism-proto" }
serde_json  = "1"
mach2       = "0.4"
ctor        = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto       = true
