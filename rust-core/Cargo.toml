[package]
name    = "parallax-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name       = "parallax_ffi"
# rlib en plus de staticlib : la cdylib échoue au link sur la cible device.
crate-type = ["staticlib", "rlib"]

# ═══════════════════════════════════════════════════════════════════════════
# LE FLAG QUI COMPTE
#
# `device` active l'intégration réelle avec idevice / isideload.
# Il est **désactivé par défaut**, et c'est délibéré.
#
# Sans lui, le crate compile seul, sans réseau, en quelques secondes, et
# expose exactement la même surface C. Les fonctions renvoient
# PX_ERR_NOT_BUILT. L'app se lance, toute l'interface est navigable, la CI
# est verte, l'IPA s'installe.
#
# Avec lui, le vrai code prend le relais — mais les signatures d'appel à
# idevice n'ont **jamais été compilées**. idevice annonce des ruptures d'API
# à chaque version mineure jusqu'à 0.2.0. Attends-toi à corriger des
# signatures au premier `--features device`, et fais-le module par module :
# `device-location` seul d'abord, puis pairing, puis account.
# ═══════════════════════════════════════════════════════════════════════════
[features]
default = []
device  = ["device-location", "device-pairing", "device-account"]

device-location = ["dep:idevice", "dep:tokio"]
device-pairing  = ["dep:idevice", "dep:tokio", "dep:mdns-sd"]
device-account  = ["dep:isideload", "dep:tokio", "dep:serde", "dep:serde_json", "dep:zip", "dep:plist", "dep:tar", "dep:flate2", "dep:lzma-rs", "dep:ruzstd", "dep:apple-codesign", "dep:base64"]

[dependencies]
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
once_cell          = "1"
serde              = { version = "1", features = ["derive"], optional = true }
serde_json         = { version = "1", optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "sync", "macros", "net"], optional = true }
mdns-sd = { version = "0.19", optional = true }

# Reconstitution de l'IPA apres signature. Meme version majeure que celle
# qu'isideload tire deja, donc cargo unifie et rien ne s'ajoute a l'arbre.
# Sans compression : le transfert est local, par le tunnel.
# `deflate` est requis pour LIRE un IPA utilisateur (souvent compressé) lors de
# l'injection de tweaks. L'écriture, elle, reste en Stored (transfert local).
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }

# Lecture de CFBundleExecutable dans Info.plist (binaire ou XML) pour trouver
# l'exécutable principal à patcher lors de l'injection de tweaks.
plist = { version = "1", optional = true }

# Extraction des tweaks `.deb` (palier 2). Un .deb est une archive `ar` (parsée
# à la main, format trivial) dont `data.tar.*` contient le dylib. Décodeurs
# **pur Rust** — pas de C à lier — pour que la cross-compilation iOS reste
# simple : tar, gzip (flate2/miniz_oxide), xz+lzma (lzma-rs), zstd (ruzstd).
tar     = { version = "0.4", optional = true }
flate2  = { version = "1", optional = true }
lzma-rs = { version = "0.3", optional = true }
ruzstd  = { version = "0.7", optional = true }

# Signature hors-ligne avec un certificat importé (.p12 + .mobileprovision),
# pour qui a acheté un certificat et veut signer sans compte Apple. On réutilise
# le fork qu'isideload tire déjà (même version, donc pas de copie en plus, et
# la cross-compilation iOS est déjà éprouvée par isideload). Renommé en
# `apple_codesign` côté code, comme le fait isideload.
# Même version qu'isideload résout déjà (0.29.11) : cargo unifie, aucune copie
# ni dépendance en plus, et cette version cross-compile déjà pour iOS dans tous
# les builds précédents.
apple-codesign = { package = "isideload-apple-codesign", version = "0.29.11", default-features = false, optional = true }

# Icônes d'app (springboardservices) transmises en base64 à Swift.
base64 = { version = "0.22", optional = true }

# Épinglé sur révision git, pas sur une plage sémantique.
# Cette révision est celle de StikPair (host RPPairing) et StikDebug (tunnel).
[dependencies.idevice]
git      = "https://github.com/jkcoxson/idevice"
rev      = "7bd551c16c6dd2e058740d85a2d9399a51a776e9"
optional = true
default-features = false
features = [
  "remote_pairing", "tunnel_tcp_stack", "rsd", "tcp", "xpc",
  "core_device_proxy", "pair", "usbmuxd",
  "installation_proxy", "afc", "house_arrest", "misagent",
  "dvt", "location_simulation", "mobile_image_mounter", "tss",
  "heartbeat", "aws-lc", "springboardservices",
]

[dependencies.isideload]
git      = "https://github.com/nab138/isideload"
branch   = "main"
optional = true
default-features = false
features = ["install", "fs-storage"]

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = "z"
lto       = true
